# Builds the Android app (android/, Capacitor) and publishes the APK as the "android" release:
#   https://github.com/Llambies/PokeKanban/releases/download/android/PokeKanban.apk
# The app loads kanban.llambies.com, so web changes don't need a new APK: this only runs when the
# native project changes, or by hand (Actions → App Android → Run workflow).
name: App Android

on:
  push:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'src/lib/native.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Web app and Capacitor sync
        run: |
          npm ci
          npm run build
          npx cap sync android

      # Optional private signing key (Settings → Secrets and variables → Actions):
      # POKEKANBAN_KEYSTORE_BASE64 (the .keystore in base64), POKEKANBAN_KEYSTORE_PASSWORD, POKEKANBAN_KEY_ALIAS.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.POKEKANBAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "POKEKANBAN_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Usando la clave de los secretos del repositorio."
          else
            echo "Usando la clave del repositorio (android/app/pokekanban.keystore)."
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          POKEKANBAN_KEYSTORE_PASSWORD: ${{ secrets.POKEKANBAN_KEYSTORE_PASSWORD }}
          POKEKANBAN_KEY_ALIAS: ${{ secrets.POKEKANBAN_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PokeKanban.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PokeKanban-${{ github.run_number }}
          path: PokeKanban.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android PokeKanban.apk \
            --target "${{ github.sha }}" \
            --title "App Android · versión 1.0.${{ github.run_number }}" \
            --notes "Descarga **PokeKanban.apk** desde el móvil e instálala (permite instalar apps de origen desconocido si te lo pide). Las nuevas versiones se instalan encima de la anterior."
